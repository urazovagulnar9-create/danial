<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Квадратное уравнение</title>
<style>
  :root { --bg: #fbfbfa; --fg: #1a1a18; --dim: #6b6b66; --line: #e4e4e0; --accent: #2563eb; --err: #b42318; --err-bg: #fdecea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --fg: #f0f0ee; --dim: #9a9a95; --line: #2e2e34; --accent: #60a5fa; --err: #ff8a80; --err-bg: #3a1c1c; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 16px; background: var(--bg); color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  main { max-width: 34rem; width: 100%; }
  h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 .75rem; }
  p { margin: 0 0 1rem; }
  .dim { color: var(--dim); }
  form { display: flex; flex-wrap: wrap; align-items: end; gap: 8px; }
  label { display: flex; flex-direction: column; flex: 1; min-width: 5rem; font-weight: 600; }
  input {
    width: 100%; padding: 10px 12px; font: inherit; font-weight: 400; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  button {
    padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer;
    color: #fff; background: var(--accent); border: 0; border-radius: 8px;
  }
  .error {
    margin-top: 12px; padding: 10px 12px; border-radius: 8px;
    color: var(--err); background: var(--err-bg);
  }
  .error:empty { display: none; }
  .result { margin-top: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
  .result:empty { display: none; }
  .result p { margin: 0; }
</style>
</head>
<body>
<main>

  <h1>Квадратное уравнение</h1>

  <p class="dim">Уравнение вида a·x² + b·x + c = 0. Введи коэффициенты и нажми «Решить» или Enter.</p>

  <form id="form">
    <label>a <input id="a" inputmode="decimal" autocomplete="off"></label>
    <label>b <input id="b" inputmode="decimal" autocomplete="off"></label>
    <label>c <input id="c" inputmode="decimal" autocomplete="off"></label>
    <button type="submit">Решить</button>
  </form>

  <p id="error" class="error" role="alert"></p>

  <div id="result" class="result"></div>

</main>
<script>
  const form = document.getElementById('form');
  const errorBox = document.getElementById('error');
  const resultBox = document.getElementById('result');

  // Читает число из поля. Запятая тоже подходит: 2,5 = 2.5
  function readNumber(id) {
    const text = document.getElementById(id).value.trim().replace(',', '.');
    if (text === '') return NaN;
    return Number(text);
  }

  // Убирает лишние знаки после запятой: 0.30000000000000004 -> 0.3
  function round(x) {
    return Number(x.toFixed(6));
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    errorBox.textContent = '';
    resultBox.innerHTML = '';

    const a = readNumber('a');
    const b = readNumber('b');
    const c = readNumber('c');

    if (!Number.isFinite(a) || !Number.isFinite(b) || !Number.isFinite(c)) {
      errorBox.textContent = 'Ошибка: во все три поля нужно ввести числа, например 1, -3, 2.';
      return;
    }
    if (a === 0) {
      errorBox.textContent = 'Ошибка: a не может быть 0 — тогда уравнение не квадратное.';
      return;
    }

    const d = b * b - 4 * a * c;
    let answer;

    if (d > 0) {
      const x1 = (-b + Math.sqrt(d)) / (2 * a);
      const x2 = (-b - Math.sqrt(d)) / (2 * a);
      answer = 'Два корня: x₁ = ' + round(x1) + ', x₂ = ' + round(x2);
    } else if (d === 0) {
      const x = -b / (2 * a);
      answer = 'Один корень: x = ' + round(x);
    } else {
      answer = 'Нет действительных корней';
    }

    resultBox.innerHTML = '<p>Дискриминант: D = ' + round(d) + '</p><p><strong>' + answer + '</strong></p>';
  });
</script>
</body>
</html>
